[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "learner"
version = "0.1.0"
description = "AlphaZero-style solver for the generalized 24 game"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "torch>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["learner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
